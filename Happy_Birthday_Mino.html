<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Mino!</title>
<style>
:root {
  --site-primary: #8f0027;
  --site-secondary: #f5a6c2;
  --site-background: #f3a6c2;
  --site-on-primary: #ffffff;
  --site-on-secondary: #30103d;
  --site-on-background: #42101f;
  --site-font-body: ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --site-font-heading: ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font-family: var(--site-font-body); background: var(--site-background); color: var(--site-on-background); }
#app { min-height: 100vh; width: 100%; overflow: hidden; position: relative; display: grid; place-items: center; padding: 28px; background: #f5a8c3; color: #42101f; isolation: isolate; }
.scene { position: absolute; inset: 0; overflow: hidden; z-index: -1; background: radial-gradient(ellipse at 20% 15%, #f8c4d7 0, transparent 42%), radial-gradient(ellipse at 85% 80%, #d96b91 0, transparent 35%), linear-gradient(145deg, #f5a8c3, #e98eae 55%, #f2b1c8); }
.glow { position: absolute; width: 42vw; height: 42vw; min-width: 240px; min-height: 240px; border-radius: 50%; background: #ffd4e3; filter: blur(95px); opacity: .35; animation: breathe 6s ease-in-out infinite alternate; }
.glow.one { top: -18%; left: -10%; }
.glow.two { right: -16%; bottom: -18%; background: #b90035; animation-delay: -3s; }
.sparkles { position: absolute; inset: 0; pointer-events: none; }
.sparkle { position: absolute; color: #8f0027; font-size: clamp(15px, 2.8vw, 28px); animation: twinkle 2.7s ease-in-out infinite; }
.card { width: min(100%, 650px); text-align: center; padding: clamp(28px, 6vw, 58px) clamp(20px, 6vw, 56px); border: 1px solid rgba(255,255,255,.55); border-radius: 32px; background: rgba(255,238,245,.72); box-shadow: 0 25px 90px rgba(111,0,38,.16); backdrop-filter: blur(18px); animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
.eyebrow { display: inline-flex; gap: 9px; align-items: center; color: #8f0027; text-transform: uppercase; letter-spacing: .12em; font-size: clamp(10px, 2.5vw, 12px); font-weight: 800; margin-bottom: 18px; }
.cake { font-size: clamp(54px, 10vw, 82px); line-height: 1.15; filter: drop-shadow(0 7px 18px rgba(255,135,205,.25)); animation: bob 3s ease-in-out infinite; }
h1 { font-family: var(--site-font-heading); font-size: clamp(36px, 8.5vw, 68px); line-height: 1.03; letter-spacing: -.055em; margin: 20px 0 17px; color: #42101f; text-wrap: balance; }
h1 span { display: block; color: #a00030; }
.message { font-size: clamp(16px, 3vw, 20px); line-height: 1.65; color: #542335; margin: 0 auto 28px; max-width: 430px; }
.divider { width: 62px; height: 3px; border-radius: 5px; margin: 0 auto 25px; background: linear-gradient(90deg, #f5a6c2, #8f0027); }
.player { margin: 0 auto; max-width: 390px; border: 1px solid rgba(143,0,39,.2); background: rgba(255,255,255,.72); border-radius: 20px; padding: 14px; display: flex; align-items: center; gap: 13px; text-align: left; }
.album { width: 54px; height: 54px; border-radius: 14px; flex: 0 0 auto; display: grid; place-items: center; font-size: 25px; background: linear-gradient(135deg, #f5a6c2, #8f0027); box-shadow: 0 5px 20px #8f002722; }
.track { min-width: 0; flex: 1; }
.track strong { display: block; font-size: 14px; color: #42101f; }
.track small { display: block; margin-top: 4px; font-size: 12px; color: #805165; }
.play { border: 0; width: 46px; height: 46px; flex: 0 0 auto; border-radius: 50%; cursor: pointer; display: grid; place-items: center; color: #ffffff; background: #8f0027; font-size: 19px; box-shadow: 0 4px 18px #8f002722; transition: transform .2s, background .2s; }
.play:hover { transform: scale(1.07); background: #65001c; }
.play:focus-visible { outline: 3px solid #8f0027; outline-offset: 4px; }
.hint { min-height: 18px; margin-top: 12px; color: #805165; font-size: 11px; }
.footer { margin-top: 27px; color: #8f4260; font-size: 12px; letter-spacing: .08em; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
.confetti i { position: absolute; top: -20px; width: 8px; height: 13px; border-radius: 2px; animation: fall var(--duration) linear forwards; }
@keyframes twinkle { 0%,100% { transform: scale(.75) rotate(0); opacity: .45; } 50% { transform: scale(1.2) rotate(18deg); opacity: 1; } }
@keyframes breathe { to { transform: scale(1.18); opacity: .26; } }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .8; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<main id="app">
  <div class="scene" aria-hidden="true"><div class="glow one"></div><div class="glow two"></div></div>
  <div class="sparkles" aria-hidden="true">
    <span class="sparkle" style="left:9%;top:17%;animation-delay:.2s">✦</span>
    <span class="sparkle" style="left:83%;top:13%;animation-delay:1.1s">✧</span>
    <span class="sparkle" style="left:15%;top:75%;animation-delay:1.8s">✧</span>
    <span class="sparkle" style="left:88%;top:70%;animation-delay:.7s">✦</span>
    <span class="sparkle" style="left:51%;top:7%;animation-delay:1.4s">·</span>
    <span class="sparkle" style="left:75%;top:89%;animation-delay:.4s">✧</span>
  </div>
  <section class="card" aria-label="Birthday wishes for Mino">
    <div class="eyebrow"><span>✦</span> ITS YOUR BIRTHDAYAYAYAYAY <span>✦</span></div>
    <div class="cake" aria-hidden="true">🎂</div>
    <h1>Happy Birthday <span>Mino!</span></h1>
    <div class="divider"></div>
    <p class="message">happy birthday mino I wish you a great year</p>
    <div class="player" aria-label="Music player">
      <div class="album" aria-hidden="true">🎵</div>
      <div class="track"><strong>DIVINE CEO</strong><small>LuLuYam · Birthday soundtrack</small></div>
      <button class="play" id="playButton" aria-label="Open DIVINE CEO on Spotify" title="Open on Spotify">▶</button>
    </div>
    <div class="hint" id="hint" role="status">Tap play to listen on Spotify</div>
    <div class="footer">MAKE A WISH ✨</div>
  </section>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
</main>
<script>
const playButton = document.getElementById('playButton');
const hint = document.getElementById('hint');
function celebrate() {
  const layer = document.getElementById('confetti');
  const colors = ['#f5a6c2', '#8f0027', '#e978a0', '#ffffff', '#f7c4d5'];
  for (let n = 0; n < 90; n++) {
    const piece = document.createElement('i');
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.setProperty('--duration', (2.5 + Math.random() * 3.5) + 's');
    piece.style.animationDelay = (Math.random() * 1.2) + 's';
    layer.appendChild(piece);
    setTimeout(() => piece.remove(), 7500);
  }
}
playButton.addEventListener('click', () => {
  celebrate();
  window.open('https://open.spotify.com/search/DIVINE%20CEO%20LuLuYam', '_blank', 'noopener');
  hint.textContent = 'Spotify opened — press play there to start the song.';
});
window.addEventListener('load', () => setTimeout(celebrate, 500));
</script>
</body>
</html>
